<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BVYHCTPY – Tra cứu thuốc nhi khoa</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#10343a;--paper:#f7fbfb;--panel:#fff;--mist:#dceef0;--line:#c5dde0;--sun:#f2b83d;--mute:#4d6b70;--bad:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--ink:#e6f4f5;--paper:#0d2226;--panel:#13302f;--mist:#17393d;--line:#264a4e;--mute:#9bbcc0;--bad:#ff8a80}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.55 "Source Sans 3",system-ui,sans-serif}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.1;margin:0}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:920px;margin:0 auto;padding:0 20px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 0}
.brand{font:800 22px "Bricolage Grotesque",sans-serif}
nav{display:flex;gap:6px;flex-wrap:wrap}
button,input,textarea,select{font:inherit;color:var(--ink)}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--ink);background:transparent;cursor:pointer;font-weight:600}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#2b1f00}
.btn.bad{border-color:var(--bad);color:var(--bad)}
h1{font-size:clamp(30px,5vw,48px);max-width:16ch;margin:20px 0 10px}
.lead{color:var(--mute);max-width:56ch;margin:0 0 22px}
.card{background:var(--panel);border:2px solid var(--ink);border-radius:16px;padding:14px}
input[type=search],input[type=email],input[type=password],input[type=text],textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
label{display:block;font-weight:600;font-size:15px;margin:12px 0 4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:14px;font-weight:600}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
ul.list{list-style:none;margin:0;padding:0}
ul.list>li{border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:10px;background:transparent;border:0;text-align:left;cursor:pointer}
.row:hover{background:var(--mist)}
.tag{font-size:13px;font-weight:600;background:var(--mist);padding:2px 8px;border-radius:6px;white-space:nowrap}
.tag.pending{background:var(--sun);color:#2b1f00}
.detail{background:var(--mist);padding:12px 16px;margin:0 0 8px;border-radius:10px}
.detail strong{display:block;margin-top:8px}.detail strong:first-child{margin-top:0}
.detail div{white-space:pre-wrap}
.meta{font-size:14px;color:var(--mute);margin-top:10px}
.msg{margin:10px 0;font-weight:600}.msg.err{color:var(--bad)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header>
  <span class="brand">BVYHCTPY</span>
  <nav>
    <button class="btn" id="nSearch">Tra cứu</button>
    <button class="btn" id="nAdmin" hidden>Quản lý dữ liệu</button>
    <button class="btn" id="nAudit" hidden>Nhật ký thay đổi</button>
    <button class="btn" id="nLogin">Đăng nhập</button>
    <button class="btn" id="nOut" hidden>Đăng xuất</button>
  </nav>
</header>
<div id="msg" class="msg" role="alert"></div>

<section id="vSearch">
  <h1>Tra cứu thuốc Bệnh viện YHCT Phú Yên</h1>
  <p class="lead">Hoàn nguyên, tương tác, tương hợp – tương kỵ và thuốc đa liều theo danh mục của bệnh viện.</p>
  <div class="card">
    <label for="q" style="margin-top:0">Nhập tên thuốc hoặc hoạt chất</label>
    <input id="q" type="search" autocomplete="off">
    <div class="chips" id="chips"></div>
    <ul class="list" id="res"></ul>
  </div>
</section>

<section id="vLogin" hidden>
  <h2>Đăng nhập cho cán bộ biên soạn</h2>
  <form id="lf" class="card" style="max-width:420px;margin-top:16px">
    <label for="em" style="margin-top:0">Email</label><input id="em" type="email" required autocomplete="username">
    <label for="pw">Mật khẩu</label><input id="pw" type="password" required autocomplete="current-password">
    <div class="bar"><button class="btn pri" type="submit">Đăng nhập</button></div>
  </form>
</section>

<section id="vAdmin" hidden>
  <h2>Quản lý dữ liệu thuốc</h2>
  <div class="bar"><button class="btn sun" id="add">Thêm thuốc</button></div>
  <div class="card scroll"><table><thead><tr><th>Tên thuốc</th><th>Trạng thái</th><th>Cập nhật</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
  <form id="ef" class="card" style="margin-top:16px" hidden>
    <h2 id="eh" style="font-size:22px"></h2>
    <label for="f_name">Tên thuốc</label><input type="text" id="f_name" required>
    <label for="f_reconstitution">Hoàn nguyên</label><textarea id="f_reconstitution" rows="3"></textarea>
    <label for="f_interactions">Tương tác</label><textarea id="f_interactions" rows="3"></textarea>
    <label for="f_compatibility">Tương hợp – tương kỵ</label><textarea id="f_compatibility" rows="3"></textarea>
    <label for="f_multidose">Thuốc đa liều</label><textarea id="f_multidose" rows="3"></textarea>
    <label for="f_source">Nguồn tài liệu (bắt buộc khi gửi duyệt)</label><input type="text" id="f_source">
    <div class="bar" id="eb"></div>
  </form>
</section>

<section id="vAudit" hidden>
  <h2>Nhật ký thay đổi</h2>
  <div class="card scroll" style="margin-top:16px"><table><thead><tr><th>Thời gian</th><th>Người thực hiện</th><th>Thao tác</th><th>Thuốc</th></tr></thead><tbody id="ab"></tbody></table></div>
</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// 1) Paste your own values from Supabase: Project Settings > API
const SUPABASE_URL = "https://fsmjghlzgjyoriumvlwp.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZzbWpnaGx6Z2p5b3JpdW12bHdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MTY5MTEsImV4cCI6MjEwOTA5MjkxMX0.MVOtO5S1JcfufEdwVyuY9jpyM2dcmfu7jQ3iTOBHHzE";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const FIELDS = [["reconstitution","Hoàn nguyên"],["interactions","Tương tác"],["compatibility","Tương hợp – tương kỵ"],["multidose","Thuốc đa liều"]];
const ST = {draft:"Nháp", pending:"Chờ duyệt", published:"Đã xuất bản"};
const VIEWS = ["Search","Login","Admin","Audit"];
let role = null, pub = [], f = "", openId = null, editing = null;

function show(v){VIEWS.forEach(x => $("#v"+x).hidden = x !== v); say("")}
function say(t, err){const m=$("#msg"); m.textContent=t; m.className="msg"+(err?" err":"")}
const d = s => s ? new Date(s).toLocaleString("vi-VN") : "";

/* ---------- Public search ---------- */
async function loadPublic(){
  const {data, error} = await sb.from("drugs").select("*").eq("status","published").order("name");
  if (error) return say("Không tải được dữ liệu: " + error.message, true);
  pub = data; renderSearch();
}
function norm(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").toLowerCase()}
function renderSearch(){
  const t = norm($("#q").value.trim());
  const out = pub.filter(x => (!t || norm(x.name).includes(t)) && (!f || x[f]));
  $("#res").innerHTML = out.length ? out.map(x => {
    const tags = FIELDS.filter(p => x[p[0]]).map(p => `<span class="tag">${p[1]}</span>`).join(" ");
    const det = openId === x.id ? `<div class="detail">${FIELDS.filter(p=>x[p[0]]).map(p=>`<strong>${p[1]}</strong><div>${esc(x[p[0]])}</div>`).join("")}<div class="meta">Nguồn: ${esc(x.source)} · Cập nhật: ${d(x.updated_at)}</div></div>` : "";
    return `<li><button class="row" data-id="${x.id}" aria-expanded="${openId===x.id}"><span>${esc(x.name)}</span><span>${tags}</span></button>${det}</li>`;
  }).join("") : `<li class="row">Không tìm thấy thuốc phù hợp. Thử tên hoạt chất hoặc bỏ bộ lọc.</li>`;
}
$("#chips").innerHTML = [["", "Tất cả"]].concat(FIELDS).map(p => `<button class="chip" data-f="${p[0]}" aria-pressed="${p[0]===""}">${p[1]}</button>`).join("");
$("#chips").onclick = e => { const c = e.target.closest(".chip"); if(!c) return; f = c.dataset.f; openId = null;
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === c)); renderSearch(); };
$("#res").onclick = e => { const b = e.target.closest(".row[data-id]"); if(!b) return; openId = openId === b.dataset.id ? null : b.dataset.id; renderSearch(); };
$("#q").oninput = () => { openId = null; renderSearch(); };

/* ---------- Auth ---------- */
async function refreshAuth(){
  const {data:{session}} = await sb.auth.getSession();
  role = null;
  if (session){
    const {data} = await sb.from("profiles").select("role").eq("id", session.user.id).maybeSingle();
    role = data ? data.role : null;
  }
  $("#nLogin").hidden = !!session; $("#nOut").hidden = !session;
  $("#nAdmin").hidden = !role; $("#nAudit").hidden = role !== "approver";
  return session;
}
$("#lf").onsubmit = async e => {
  e.preventDefault();
  const {error} = await sb.auth.signInWithPassword({email:$("#em").value, password:$("#pw").value});
  if (error) return say("Đăng nhập không thành công. Kiểm tra lại email và mật khẩu.", true);
  $("#pw").value = ""; await refreshAuth();
  if (role) { show("Admin"); loadAdmin(); } else { show("Search"); say("Tài khoản chưa được cấp quyền biên soạn. Liên hệ quản trị viên.", true); }
};
$("#nOut").onclick = async () => { await sb.auth.signOut(); await refreshAuth(); show("Search"); };
$("#nSearch").onclick = () => { show("Search"); loadPublic(); };
$("#nLogin").onclick = () => show("Login");
$("#nAdmin").onclick = () => { show("Admin"); loadAdmin(); };
$("#nAudit").onclick = () => { show("Audit"); loadAudit(); };

/* ---------- Editor / approver ---------- */
async function loadAdmin(){
  $("#ef").hidden = true;
  const {data, error} = await sb.from("drugs").select("*").order("updated_at", {ascending:false});
  if (error) return say("Không tải được danh sách: " + error.message, true);
  window._all = data;
  $("#tb").innerHTML = data.map(x => `<tr><td>${esc(x.name)}</td><td><span class="tag ${x.status}">${ST[x.status]}</span></td><td>${d(x.updated_at)}</td><td><button class="btn" data-id="${x.id}">Sửa</button></td></tr>`).join("") || `<tr><td colspan="4">Chưa có thuốc nào. Chọn "Thêm thuốc" để bắt đầu.</td></tr>`;
}
const FORM = ["name","source"].concat(FIELDS.map(p => p[0]));
function openForm(x){
  editing = x; $("#ef").hidden = false;
  $("#eh").textContent = x ? "Sửa: " + x.name : "Thêm thuốc mới";
  FORM.forEach(k => $("#f_"+k).value = x ? (x[k] || "") : "");
  const locked = role === "editor" && x && x.status === "published";
  const b = $("#eb"); b.innerHTML = "";
  const mk = (txt, cls, fn) => { const e = document.createElement("button"); e.type="button"; e.className="btn "+cls; e.textContent=txt; e.onclick=fn; b.appendChild(e); };
  if (locked) { b.textContent = "Mục đã xuất bản chỉ người duyệt mới sửa được."; return; }
  mk("Lưu nháp", "", () => save("draft"));
  mk("Gửi duyệt", "pri", () => save("pending"));
  if (role === "approver") mk("Xuất bản", "sun", () => save("published"));
  if (role === "approver" && x) mk("Xóa", "bad", del);
  $("#ef").scrollIntoView({behavior:"smooth"});
}
$("#add").onclick = () => openForm(null);
$("#tb").onclick = e => { const b = e.target.closest("button[data-id]"); if (b) openForm(window._all.find(x => x.id === b.dataset.id)); };
async function save(status){
  const row = {status}; FORM.forEach(k => row[k] = $("#f_"+k).value.trim() || null);
  if (!row.name) return say("Nhập tên thuốc trước khi lưu.", true);
  if (status !== "draft" && !row.source) return say("Nhập nguồn tài liệu trước khi gửi duyệt hoặc xuất bản.", true);
  const q = editing ? sb.from("drugs").update(row).eq("id", editing.id) : sb.from("drugs").insert(row);
  const {error} = await q;
  if (error) return say("Không lưu được: " + error.message, true);
  say(status === "published" ? "Đã xuất bản." : status === "pending" ? "Đã gửi duyệt." : "Đã lưu nháp."); loadAdmin();
}
async function del(){
  if (!confirm("Xóa thuốc này? Thao tác sẽ được ghi vào nhật ký.")) return;
  const {error} = await sb.from("drugs").delete().eq("id", editing.id);
  if (error) return say("Không xóa được: " + error.message, true);
  say("Đã xóa."); loadAdmin();
}

/* ---------- Audit log (approvers) ---------- */
async function loadAudit(){
  const {data, error} = await sb.from("audit_log").select("*").order("at", {ascending:false}).limit(100);
  if (error) return say("Không tải được nhật ký: " + error.message, true);
  const A = {INSERT:"Thêm", UPDATE:"Sửa", DELETE:"Xóa"};
  $("#ab").innerHTML = data.map(r => { const x = r.new_row || r.old_row || {};
    const st = r.new_row ? " → " + ST[r.new_row.status] : "";
    return `<tr><td>${d(r.at)}</td><td>${esc(r.actor_email)}</td><td>${A[r.action]}${st}</td><td>${esc(x.name)}</td></tr>`; }).join("");
}

/* ---------- Start ---------- */
refreshAuth().then(loadPublic);
</script>
</body>
</html>
